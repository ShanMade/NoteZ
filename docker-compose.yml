version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: notez-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: notez-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333

  fastapi:
    build:
      context: ./fastapi_app
      dockerfile: Dockerfile
    container_name: notez-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/app_db
      - QDRANT_URL=http://qdrant:6333
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

  nextjs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notez-nextjs
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/app_db
      - QDRANT_URL=http://qdrant:6333
      - FASTAPI_URL=http://fastapi:8000
    depends_on:
      - postgres
      - qdrant
      - fastapi

volumes:
  postgres_data:
  qdrant_data:
